name: 윈도우 ZIP 만들기

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"  # 러너 콘솔(cp1252)에서도 한글 로그가 깨지거나 멈추지 않게
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: python -m pip install --upgrade pip pyinstaller python-hwpx pypdf

      - name: AI 엔진(llama.cpp) 빌드
        # 공공기관 저사양 PC(AVX2가 없는 구형·보급형 CPU 포함)에서도 돌도록 CPU 세대별 엔진을 모두 만들고,
        # 실행할 때 그 PC에 맞는 것을 고른다(gongmun_ai.llm.load_cpu_backend).
        # llama-cpp-python은 세대별 엔진을 패키지에 넣지 않으므로 소스를 받아 설치 규칙을 고친 뒤 빌드한다.
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON"
        shell: bash
        run: |
          python -m pip download --no-deps --no-binary :all: llama-cpp-python==0.3.36 -d llsrc
          tar xzf llsrc/llama_cpp_python-0.3.36.tar.gz -C llsrc
          python packaging/patch_llama_cpp.py llsrc/llama_cpp_python-0.3.36
          python -m pip install --no-cache-dir ./llsrc/llama_cpp_python-0.3.36
          ls "$(python -c 'import llama_cpp,os;print(os.path.dirname(llama_cpp.__file__))')/lib"

      - name: 프로그램 설치와 테스트
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v

      - uses: actions/cache@v4
        with:
          path: model-cache
          key: qwen3-q4_k_m-1.7b-4b

      - name: 시험용 AI 모델 받기 (AI모델_받기.bat과 같은 주소)
        shell: bash
        run: |
          mkdir -p model-cache
          get() { [ -s "model-cache/$1" ] || curl -fL --retry 3 -o "model-cache/$1" "$2"; }
          get Qwen3-1.7B-Q4_K_M.gguf https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf
          get Qwen3-4B-Q4_K_M.gguf https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf
          ls -l model-cache

      - name: 실행 파일과 ZIP 만들기 (실제 AI 모델로 자체 점검)
        env:
          TEST_MODELS: model-cache/Qwen3-1.7B-Q4_K_M.gguf;model-cache/Qwen3-4B-Q4_K_M.gguf
        run: python packaging/build_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: 공문서AI_윈도우
          path: dist/GongmunAI_windows.zip

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="build-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$tag" "dist/GongmunAI_windows.zip" \
            --target "${GITHUB_SHA}" --title "공문서AI 윈도우 ($tag)" \
            --notes "압축을 풀고 공문서AI.exe를 실행하세요. 설치가 필요 없습니다. AI 모델은 AI모델_받기.bat으로 받습니다."
