[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongmun-ai"
version = "0.1.0"
description = "저사양 업무 PC에서 외부 통신 없이 동작하는 공문서 작성 보조 AI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# 로컬 LLM 실행 엔진 (MIT). 규칙 기반 교정만 쓸 때는 필요 없음.
llm = ["llama-cpp-python>=0.3"]

[project.scripts]
gongmun = "gongmun_ai.cli:main"

[project.gui-scripts]
gongmun-gui = "gongmun_ai.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
